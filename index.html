<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if not here, nowhere</title>
    
    <style>
        :root {
            --primary-blue: #051650;
            --primary-orange: #EC5800;
            --bg-dark: #0f0c29;
            --text-light: #f5f5f5;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            z-index: -2;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100vw); opacity: 0; }
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            padding: 0 20px;
        }

        #searchContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .top-icon-btn {
            padding: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid var(--primary-blue);
            background-color: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .top-icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(5, 22, 80, 0.6);
            border-color: var(--primary-orange);
        }

        #btnKeepWatching, #btnSaved {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            overflow: visible !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #btnKeepWatching {
            width: 38px !important;
            height: 38px !important;
            margin-left: 20px !important;
            margin-right: 8px !important;
        }

        #btnSaved {
            width: 56px !important;
            height: 56px !important;
        }

        #btnKeepWatching img, #btnSaved img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: all 0.2s ease;
        }

        #btnKeepWatching img {
            border-radius: 50%;
        }

        #btnKeepWatching:hover img, #btnSaved:hover img {
            transform: scale(1.15) translateY(-2px);
            filter: drop-shadow(0 6px 12px rgba(236, 88, 0, 0.6));
        }

        #btnAdvancedToggle {
            background-color: #333;
            border: 1px solid #555;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        #btnAdvancedToggle:hover { background-color: #444; }

        #searchInput {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background-color: #222;
            color: white;
            font-size: 1rem;
        }

        #searchInput:focus { outline: none; border-color: var(--primary-blue); }

        button, #typeSelector {
            padding: 12px 20px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        button:hover, #typeSelector:hover { opacity: 0.9; transform: translateY(-1px); }

        #typeSelector { background-color: #333; border: 1px solid #555; }
        #searchButton { background-color: var(--primary-blue); }

        #btnRandom {
            background-color: var(--primary-blue);
            color: var(--primary-orange);
            border: 1px solid var(--primary-orange);
            box-shadow: 0 0 8px rgba(236, 88, 0, 0.2);
        }

        #advancedSearchPanel {
            display: none;
            flex-wrap: wrap;
            gap: 15px;
            margin: 5px auto 30px auto;
            background: rgba(26, 26, 46, 0.95);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            max-width: 1000px;
            border: 1px solid var(--primary-blue);
            justify-content: center;
            align-items: flex-end;
            animation: fadeIn 0.3s ease;
        }

        .adv-group { display: flex; flex-direction: column; min-width: 140px; flex: 1; }
        .adv-label { color: var(--primary-orange); font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .adv-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 0.95rem; }
        
        input[type="range"].adv-input {
            width: 100%;
            max-width: 160px;
            padding: 0;
            margin-top: 8px;
            height: 6px;
        }

        #btnDoAdvanced {
            background-color: var(--primary-blue);
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            flex: 0 1 auto;
            margin-bottom: 2px;
        }

        #resultsHeader {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
            border-bottom: 2px solid var(--primary-blue);
            display: inline-block;
            padding-bottom: 5px;
        }

        #results, .similar-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .result-item {
            text-align: center;
            flex: 0 0 200px;
            width: 200px;
            max-width: 200px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .result-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 25px rgba(5, 22, 80, 0.6);
        }
        
        .result-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .result-item h2 {
            font-size: 15px;
            margin: 12px 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #infoContainer {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: transparent;
            color: #ccc;
            padding: 0;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-btn:hover { color: white; background: transparent; transform: translateX(-5px); }

        .info-hero { display: flex; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
        .info-poster { width: 250px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); flex-shrink: 0; }
        .info-content { flex: 1; min-width: 300px; }
        .info-title { font-size: 2.5rem; margin: 0 0 10px 0; font-weight: 800; }
        
        .info-meta { display: flex; align-items: center; gap: 15px; color: #bbb; font-size: 0.95rem; margin-bottom: 20px; flex-wrap: wrap; }
        .info-rating { color: #f5c518; font-weight: bold; }
        
        .info-genres { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .genre-tag {
            background-color: var(--primary-blue);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #1a2a6c;
        }

        .info-synopsis { line-height: 1.6; color: #ddd; margin-bottom: 25px; }

        .action-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .btn-watch { background-color: var(--primary-blue); padding: 12px 30px; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(5, 22, 80, 0.4); }
        .btn-watch:hover { filter: brightness(1.2); }
        
        .btn-trailer { background-color: #333; color: white; border: 1px solid #555; padding: 12px 25px; font-size: 1.1rem; }
        .btn-trailer:hover { background-color: #444; }

        .info-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 250px;
            gap: 50px;
            border-top: 1px solid #333;
            padding-top: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
            .info-hero { justify-content: center; text-align: center; }
            .info-meta { justify-content: center; }
            .info-genres { justify-content: center; }
            .action-buttons { justify-content: center; }
        }

        .section-title { border-left: 4px solid var(--primary-blue); padding-left: 10px; margin-top: 0; font-size: 1.3rem; margin-bottom: 15px; }

        .cast-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; }
        .cast-container::-webkit-scrollbar { height: 8px; }
        .cast-container::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        
        .cast-member { text-align: center; width: 80px; flex-shrink: 0; cursor: pointer; transition: transform 0.2s ease; }
        .cast-member:hover { transform: translateY(-5px); }
        
        .cast-img {
            width: 80px; height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 8px;
            border: 2px solid #333;
            transition: border-color 0.2s;
        }
        .cast-member:hover .cast-img { border-color: var(--primary-orange); }

        .cast-name { font-size: 0.8rem; font-weight: bold; margin: 0; white-space: normal; }
        .cast-role { font-size: 0.7rem; color: #aaa; margin: 0; }

        .detail-item { margin-bottom: 15px; }
        .detail-label { font-size: 0.8rem; color: #888; text-transform: uppercase; margin: 0 0 2px 0; }
        .detail-value { font-size: 1rem; margin: 0; font-weight: 500; overflow-wrap: break-word; word-wrap: break-word; }

        .clickable-detail { color: var(--primary-orange); cursor: pointer; transition: color 0.2s ease; font-weight: 600; }
        .clickable-detail:hover { color: #fff; text-decoration: underline; }

        .similar-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 15px; justify-content: flex-start; }
        .similar-row::-webkit-scrollbar { height: 8px; }
        .similar-row::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .similar-row .result-item { flex: 0 0 150px; width: 150px; max-width: 150px; }
        .similar-row .result-item img { width: 100%; height: 225px; object-fit: cover; }

        #imdbIdDisplay {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #playerSection {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #player-container-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }

        #player {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        #player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #episodeControls {
            display: none;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(15, 12, 41, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 25px auto;
        }

        .control-row {
            display: flex;
            align-items: center;
            color: white;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            gap: 10px;
        }

        #episodeControls input[type="number"] {
            width: 60px; padding: 6px; text-align: center;
            background-color: #222; color: white;
            border: 1px solid #555; border-radius: 6px; font-weight: bold;
        }

        .ep-btn-blue {
            background-color: var(--primary-blue); color: white; padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s;
        }
        .ep-btn-blue:hover { filter: brightness(1.2); }

        .ep-btn-orange {
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange) 70%, #fff 150%);
            color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 15px rgba(236, 88, 0, 0.4); text-shadow: 0 1px 2px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .ep-btn-orange:hover { filter: brightness(1.1); transform: scale(1.02); }

        #randomizerModal, #trailerModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
        }
        .random-box {
            background: #1a1a2e; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 1px solid #333; position: relative;
        }
        .random-title {
            color: white; margin-top: 0; text-align: center; font-size: 1.5rem;
            border-bottom: 2px solid var(--primary-blue); padding-bottom: 10px; margin-bottom: 20px;
        }
        .random-group { margin-bottom: 20px; }
        .random-label { display: block; color: var(--primary-orange); font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
        .random-select, .random-range {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 1rem; cursor: pointer;
        }
        .random-select:focus { outline: none; border-color: var(--primary-orange); }
        
        #btnDoRandom {
            width: 100%; background: var(--primary-blue); color: var(--primary-orange); padding: 15px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(5, 22, 80, 0.6);
        }
        #btnDoRandom:hover { filter: brightness(1.3); transform: scale(1.02); }

        .modal-content { position: relative; width: 90%; max-width: 900px; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .close-modal { position: absolute; top: 10px; right: 15px; color: white; font-size: 30px; cursor: pointer; z-index: 10; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .close-modal:hover { color: var(--primary-orange); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #messageBox {
            display: none; padding: 15px; margin: 0 auto 20px auto; max-width: 600px;
            border-radius: 8px; background-color: #28a745; color: white;
            text-align: center; font-weight: bold; position: sticky; top: 20px; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <h1 id="mainTitle">if not here, nowhere</h1>
    <div id="messageBox"></div>

    <div id="searchContainer">
        <button id="btnHome" class="top-icon-btn" title="Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0l.11.11,80,75.48A16,16,0,0,1,224,115.55Z"></path></svg>
        </button>
        <input type="text" id="searchInput" placeholder="Search movies or tv shows...">
        <select id="typeSelector">
            <option value="movie">Movies</option>
            <option value="tv">TV Shows</option>
        </select>
        <button id="searchButton">Search</button>
        <button id="btnAdvancedToggle" title="Advanced Filters">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128ZM104,168a8,8,0,0,0-8-8H64a8,8,0,0,0,0,16H96A8,8,0,0,0,104,168Zm96-16H152a16,16,0,0,0-32,0H96a8,8,0,0,0,0,16h24a16,16,0,0,0,32,0h48a8,8,0,0,0,0-16Zm0-64H160a8,8,0,0,0,0,16h40a8,8,0,0,0,0-16ZM112,72a16,16,0,0,0-32,0H64a8,8,0,0,0,0,16H80a16,16,0,0,0,32,0h88a8,8,0,0,0,0-16Z"></path></svg>
        </button>
        <button id="btnRandom">I'm bored</button>
        
        <button id="btnKeepWatching" title="Keep Watching">
            <img src="kw_icon.png" alt="Keep Watching">
        </button>
        <button id="btnSaved" title="Saved (Watchlist)">
            <img src="saved_file.png" alt="Saved">
        </button>
    </div>

    <div id="advancedSearchPanel">
        <div class="adv-group">
            <label class="adv-label">Genre:</label>
            <select id="advGenre" class="adv-input"><option value="">ALL</option></select>
        </div>
        <div class="adv-group">
            <label class="adv-label">Decade:</label>
            <select id="advDecade" class="adv-input">
                <option value="">ALL</option>
                <option value="2020">2020s</option>
                <option value="2010">2010s</option>
                <option value="2000">2000s</option>
                <option value="1990">1990s</option>
                <option value="1980">1980s</option>
                <option value="1970">1970s</option>
                <option value="1960">1960s</option>
                <option value="1950">1950s</option>
            </select>
        </div>
        <div class="adv-group">
            <label class="adv-label">Min Rating: <span id="advRatingDisplay" style="color:white">0</span> / 10</label>
            <input type="range" id="advRating" class="adv-input" min="0" max="10" step="1" value="0" oninput="document.getElementById('advRatingDisplay').textContent = this.value">
        </div>
        <div class="adv-group">
            <label class="adv-label">Runtime: Under <span id="advRuntimeDisplay" style="color:white">300</span> m</label>
            <input type="range" id="advRuntime" class="adv-input" min="30" max="300" step="10" value="300" oninput="document.getElementById('advRuntimeDisplay').textContent = this.value">
        </div>
        <button id="btnDoAdvanced" onclick="executeAdvancedSearch()">Filter Search</button>
    </div>
    
    <div id="resultsWrapper">
        <div style="text-align: center;">
            <div id="resultsHeader">Trending Today</div>
        </div>
        <div id="results"></div>
    </div>

    <div id="infoContainer">
        <button class="back-btn" onclick="closeDetails()">← Go Back</button>
        <div class="info-hero">
            <img id="infoPoster" class="info-poster" src="" alt="Poster">
            <div class="info-content">
                <h2 id="infoTitle" class="info-title">Title</h2>
                <div class="info-meta">
                    <span id="infoRating" class="info-rating">★ 0.0</span>
                    <span id="infoYear">2000</span>
                    <span id="infoRuntime">0h 0m</span>
                    <span id="infoStatus">Status</span>
                </div>
                <div id="infoGenres" class="info-genres"></div>
                <p id="infoSynopsis" class="info-synopsis">Overview...</p>
                
                <div class="action-buttons">
                    <button id="btnWatchNow" class="btn-watch">▶ Watch Now</button>
                    <button id="btnTrailer" class="btn-trailer">Trailer</button>
                    <button id="btnSaveToggle" class="btn-trailer" style="display: flex; align-items: center; gap: 8px;">
                        <img id="saveIconImg" src="add_save_wl.png" style="width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));">
                        <span id="saveBtnText">Save</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="info-grid">
            <div>
                <h3 class="section-title">Cast</h3>
                <div id="infoCast" class="cast-container"></div>
            </div>
            <div>
                <h3 class="section-title">Details</h3>
                <div id="infoDetailsSidebar"></div>
            </div>
        </div>

        <div>
            <h3 class="section-title">You May Also Like</h3>
            <div id="infoSimilar" class="similar-row"></div>
        </div>
    </div>

    <div id="playerSection">
        <button class="back-btn" onclick="backToDetails()">← Back to Info</button>
        
        <div id="imdbIdDisplay"></div>
        
        <div id="main-content">
            <div id="episodeControls">
                <button id="prevSeason" class="ep-btn-blue">Previous Season</button>
                <div class="control-row">
                    <label for="seasonInput">Season:</label>
                    <input type="number" id="seasonInput" value="1" min="1">
                </div>
                <button id="nextSeason" class="ep-btn-blue">Next Season</button>
                
                <button id="prevEpisode" class="ep-btn-blue">Previous Episode</button>
                <div class="control-row">
                    <label for="episodeInput">Episode:</label>
                    <input type="number" id="episodeInput" value="1" min="1">
                </div>
                <button id="playNextButton" class="ep-btn-orange">Next Episode ▶</button>
            </div>

            <div id="player-container-wrapper">
                <div id="player"></div>
            </div>

            <div id="bottomSimilarContainer" style="display: none; width: 100%; max-width: 1000px; margin: 0 auto 30px auto;">
                <h3 class="section-title">You May Also Like</h3>
                <div id="playerSimilarGrid" class="similar-row"></div>
            </div>
            
        </div>
    </div>

    <div id="randomizerModal">
        <div class="random-box">
            <span class="close-modal" onclick="closeRandomizer()">×</span>
            <h2 class="random-title">Find a random title based on</h2>
            <div class="random-group">
                <label class="random-label">Genre:</label>
                <select id="randGenre" class="random-select"><option value="">ALL</option></select>
            </div>
            <div class="random-group">
                <label class="random-label">Decade:</label>
                <select id="randDecade" class="random-select">
                    <option value="">ALL</option>
                    <option value="2020">2020s</option>
                    <option value="2010">2010s</option>
                    <option value="2000">2000s</option>
                    <option value="1990">1990s</option>
                    <option value="1980">1980s</option>
                    <option value="1970">1970s</option>
                    <option value="1960">1960s</option>
                    <option value="1950">1950s</option>
                </select>
            </div>
            <div class="random-group">
                <label class="random-label">Minimum Rating: <span id="ratingValDisplay" style="color:white">0</span> / 10</label>
                <input type="range" id="randRating" class="random-range" min="0" max="10" step="1" value="0" oninput="document.getElementById('ratingValDisplay').textContent = this.value">
            </div>
            <div class="random-group">
                <label class="random-label">Runtime: Under <span id="runtimeValDisplay" style="color:white">300</span> mins</label>
                <input type="range" id="randRuntime" class="random-range" min="30" max="300" step="10" value="300" oninput="document.getElementById('runtimeValDisplay').textContent = this.value">
            </div>
            <button id="btnDoRandom" onclick="executeRandomizer()">RANDOMIZE</button>
        </div>
    </div>

    <div id="trailerModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTrailer()">×</span>
            <div class="video-container" id="trailerContainer"></div>
        </div>
    </div>

    <script>
        const testss = '28,93,16,16,70,10,93,67,13,84,92,22,69,83,93,19,68,94,20,10,90,69,31,64,14,17,16,23,88,86,69,92'; 
        const masterSalt = 'you shouldnt be so nosy'; 
        
        let apiKey = ''; 
        let currentTmdbId = '';
        let currentTitle = '';
        let currentPoster = '';
        let currentType = 'movie';
        let currentSeason = 1;
        let currentEpisode = 1;
        let currentTotalSeasons = 0;
        let activeTrailerKey = null;

        const fallbackQuotes = [
            { quote: "Life is like a box of chocolates. You never know what you're gonna get.", author: "Forrest Gump" },
            { quote: "May the Force be with you.", author: "Star Wars" },
            { quote: "I'll be back.", author: "The Terminator" },
            { quote: "To infinity and beyond!", author: "Toy Story" },
            { quote: "Here's looking at you, kid.", author: "Casablanca" },
            { quote: "There's no place like home.", author: "The Wizard of Oz" },
            { quote: "I'm going to make him an offer he can't refuse.", author: "The Godfather" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            try {
                apiKey = testss.split(',').map((code, i) => 
                    String.fromCharCode(parseInt(code) ^ masterSalt.charCodeAt(i % masterSalt.length))
                ).join('');
                
                initializeApp();
            } catch(e) {
                console.error("Initialization failed:", e);
                document.getElementById('mainTitle').textContent = "Configuration Error";
            }
        });

        function getValidReleasedItems(items) {
            const today = new Date().toISOString().split('T')[0];
            return items.filter(item => {
                const dateStr = item.release_date || item.first_air_date;
                if (!dateStr) return true; 
                return dateStr <= today;
            });
        }

        async function updatePageTitleWithQuote() {
            const titleEl = document.getElementById('mainTitle');
            try {
                // Hacemos fetch a tu archivo JSON local
                const response = await fetch('motivation.json');
                
                if (!response.ok) throw new Error('Archivo motivation.json no encontrado');
                
                const data = await response.json();
                
                // Entramos al arreglo "motivationalQuotes" que viene en tu archivo
                const quotes = data.motivationalQuotes;
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                
                titleEl.textContent = `"${randomQuote.quote}" - ${randomQuote.author}`;
            } catch (error) {
                // Si el archivo falla (ej. si no se ha subido a GitHub aún), usamos las de repuesto
                console.warn("Usando frases de repuesto:", error.message);
                const randomQuote = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
                titleEl.textContent = `"${randomQuote.quote}" - ${randomQuote.author}`;
            }
        }

        function initializeApp() {
            createParticles();
            updatePageTitleWithQuote();
            setupEventListeners();
            
            if (apiKey) {
                loadTrending(document.getElementById('typeSelector').value);
                populateGenres();
            }
        }

        function setupEventListeners() {
            document.getElementById('searchButton').addEventListener('click', handleSearch);
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
            
            document.getElementById('btnRandom').addEventListener('click', handleRandomize);
            
            document.getElementById('btnHome').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('advancedSearchPanel').style.display = 'none';
                showResultsView();
                loadTrending(document.getElementById('typeSelector').value);
            });
            
            document.getElementById('btnAdvancedToggle').addEventListener('click', () => {
                const panel = document.getElementById('advancedSearchPanel');
                panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
            });

            document.getElementById('btnKeepWatching').addEventListener('click', showKeepWatching);
            document.getElementById('btnSaved').addEventListener('click', showSavedList);
            document.getElementById('btnSaveToggle').addEventListener('click', toggleSaved);

            document.getElementById('typeSelector').addEventListener('change', (e) => {
                populateGenres();
                if(document.getElementById('resultsWrapper').style.display !== 'none') {
                    loadTrending(e.target.value);
                }
            });

            document.getElementById('prevSeason').addEventListener('click', () => changeSeason(-1));
            document.getElementById('nextSeason').addEventListener('click', () => changeSeason(1));
            document.getElementById('prevEpisode').addEventListener('click', () => changeEpisode(-1));
            document.getElementById('seasonInput').addEventListener('change', updateSeason);
            document.getElementById('episodeInput').addEventListener('change', updateEpisode);
            document.getElementById('playNextButton').addEventListener('click', playNext);
            
            document.getElementById('trailerModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('trailerModal')) closeTrailer();
            });

            window.addEventListener('message', handlePlayerEvents);
        }

        function showResultsView() {
            document.getElementById('resultsWrapper').style.display = 'block';
            document.getElementById('infoContainer').style.display = 'none';
            document.getElementById('playerSection').style.display = 'none';
        }

        function closeDetails() {
            showResultsView();
        }

        function backToDetails() {
            document.getElementById('playerSection').style.display = 'none';
            document.getElementById('infoContainer').style.display = 'block';
            document.getElementById('player').innerHTML = ''; 
            
            loadSimilarContent(currentTmdbId, currentType);
        }

        function openTrailer(key) {
            document.getElementById('trailerContainer').innerHTML = `<iframe src="https://www.youtube.com/embed/${key}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            document.getElementById('trailerModal').style.display = 'flex';
        }

        function closeTrailer() {
            document.getElementById('trailerModal').style.display = 'none';
            document.getElementById('trailerContainer').innerHTML = ''; 
        }

        function changeSeason(dir) {
            const newSeason = currentSeason + dir;
            if (newSeason >= 1 && newSeason <= currentTotalSeasons) {
                embedTvShow(currentTmdbId, newSeason, 1);
            }
        }

        function changeEpisode(dir) {
            const newEpisode = currentEpisode + dir;
            if (newEpisode >= 1) {
                embedTvShow(currentTmdbId, currentSeason, newEpisode);
            }
        }

        function updateSeason() {
            const val = parseInt(document.getElementById('seasonInput').value);
            if (val >= 1 && val <= currentTotalSeasons) {
                embedTvShow(currentTmdbId, val, 1);
            }
        }

        function updateEpisode() {
            const val = parseInt(document.getElementById('episodeInput').value);
            if (val >= 1) {
                embedTvShow(currentTmdbId, currentSeason, val);
            }
        }

        function playNext() {
            embedTvShow(currentTmdbId, currentSeason, currentEpisode + 1);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                document.getElementById('btnHome').click();
                return;
            }

            document.getElementById('advancedSearchPanel').style.display = 'none';
            showResultsView();
            document.getElementById('resultsHeader').textContent = "Search Results";
            searchContent(query);
        }

        function populateGenres() {
            if (!apiKey) return;
            const type = document.getElementById('typeSelector').value;
            const url = `https://api.themoviedb.org/3/genre/${type}/list?api_key=${apiKey}&language=en-US`;
            
            fetch(url).then(r => r.json()).then(data => {
                const randSelect = document.getElementById('randGenre');
                const advSelect = document.getElementById('advGenre');
                randSelect.innerHTML = '<option value="">ALL</option>';
                advSelect.innerHTML = '<option value="">ALL</option>';
                
                if(data.genres) {
                    data.genres.forEach(g => { 
                        randSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`; 
                        advSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`; 
                    });
                }
            }).catch(e => console.error(e));
        }

        function handleRandomize() {
            if (!apiKey) return;
            document.getElementById('randomizerModal').style.display = 'flex';
        }

        function closeRandomizer() {
            document.getElementById('randomizerModal').style.display = 'none';
        }

        function executeRandomizer() {
            const type = document.getElementById('typeSelector').value;
            const genre = document.getElementById('randGenre').value;
            const decade = document.getElementById('randDecade').value;
            const rating = document.getElementById('randRating').value;
            const runtime = document.getElementById('randRuntime').value;

            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${apiKey}&language=en-US&sort_by=popularity.desc`;
            
            if (genre) url += `&with_genres=${genre}`;
            if (rating > 0) url += `&vote_average.gte=${rating}`;
            
            if (type === 'movie') {
                if (runtime < 300) url += `&with_runtime.lte=${runtime}`;
                if (decade) {
                    const start = `${decade}-01-01`;
                    const end = `${parseInt(decade)+9}-12-31`;
                    url += `&primary_release_date.gte=${start}&primary_release_date.lte=${end}`;
                }
            } else {
                if (runtime < 300) url += `&with_runtime.lte=${runtime}`;
                if (decade) {
                    const start = `${decade}-01-01`;
                    const end = `${parseInt(decade)+9}-12-31`;
                    url += `&first_air_date.gte=${start}&first_air_date.lte=${end}`;
                }
            }

            fetch(url).then(r => r.json()).then(data => {
                const validAvailable = getValidReleasedItems(data.results);
                if (validAvailable.length === 0) {
                    alert("No released results found for these filters. Try broadening them.");
                    return;
                }
                const maxPage = Math.min(data.total_pages, 500);
                const randomPage = Math.floor(Math.random() * maxPage) + 1;
                
                fetch(`${url}&page=${randomPage}`).then(r => r.json()).then(finalData => {
                    const validResults = getValidReleasedItems(finalData.results);
                    if(validResults.length > 0) {
                        const randomItem = validResults[Math.floor(Math.random() * validResults.length)];
                        closeRandomizer();
                        showDetails(randomItem.id, type);
                    } else {
                        const randomItem = validAvailable[Math.floor(Math.random() * validAvailable.length)];
                        closeRandomizer();
                        showDetails(randomItem.id, type);
                    }
                });
            }).catch(err => console.error(err));
        }

        function executeAdvancedSearch() {
            if (!apiKey) return;
            
            const type = document.getElementById('typeSelector').value;
            const genre = document.getElementById('advGenre').value;
            const decade = document.getElementById('advDecade').value;
            const rating = document.getElementById('advRating').value;
            const runtime = document.getElementById('advRuntime').value;

            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${apiKey}&language=en-US&sort_by=popularity.desc`;
            
            if (genre) url += `&with_genres=${genre}`;
            if (rating > 0) url += `&vote_average.gte=${rating}`;
            
            if (type === 'movie') {
                if (runtime < 300) url += `&with_runtime.lte=${runtime}`;
                if (decade) {
                    const start = `${decade}-01-01`;
                    const end = `${parseInt(decade)+9}-12-31`;
                    url += `&primary_release_date.gte=${start}&primary_release_date.lte=${end}`;
                }
            } else {
                if (runtime < 300) url += `&with_runtime.lte=${runtime}`;
                if (decade) {
                    const start = `${decade}-01-01`;
                    const end = `${parseInt(decade)+9}-12-31`;
                    url += `&first_air_date.gte=${start}&first_air_date.lte=${end}`;
                }
            }

            document.getElementById('advancedSearchPanel').style.display = 'none';
            showResultsView();
            document.getElementById('resultsHeader').textContent = "Filtered Results";
            
            fetch(url).then(r => r.json()).then(data => {
                const validResults = getValidReleasedItems(data.results);
                if (validResults.length === 0) {
                    document.getElementById('results').innerHTML = '<p>No released results found for these filters.</p>';
                } else {
                    displayResults(validResults, 'results');
                }
            }).catch(err => console.error(err));
        }

        function loadTrending(type) {
            if (!apiKey) return;
            document.getElementById('resultsHeader').textContent = type === 'movie' ? "Trending Movies" : "Trending TV Shows";
            const url = `https://api.themoviedb.org/3/trending/${type}/day?api_key=${apiKey}&language=en-US`;
            
            fetch(url)
                .then(r => r.json())
                .then(data => displayResults(getValidReleasedItems(data.results), 'results'))
                .catch(err => console.error("Trending error:", err));
        }

        function searchContent(query) {
            if (!apiKey) { showMessage("Missing API Key.", true); return; }
            showResultsView(); 
            const type = document.getElementById('typeSelector').value;
            const url = `https://api.themoviedb.org/3/search/${type}?api_key=${apiKey}&query=${encodeURIComponent(query)}&language=en-US`;

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    const validResults = getValidReleasedItems(data.results);
                    if (validResults.length === 0) document.getElementById('results').innerHTML = '<p>No results found.</p>';
                    else displayResults(validResults, 'results');
                })
                .catch(err => console.error(err));
        }

        function displayResults(results, containerId, limit = null) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            container.scrollLeft = 0; 

            const itemsToDisplay = limit ? results.slice(0, limit) : results;

            itemsToDisplay.forEach(result => {
                const item = document.createElement('div');
                item.classList.add('result-item');
                
                const imgUrl = result.poster_path ? `https://image.tmdb.org/t/p/w300${result.poster_path}` : 'https://placehold.co/200x300/111/fff?text=No+Poster';
                item.innerHTML = `
                    <img src="${imgUrl}" alt="${result.title || result.name}">
                    <h2>${result.title || result.name}</h2>
                `;

                item.addEventListener('click', () => {
                    const itemType = result.media_type || document.getElementById('typeSelector').value; 
                    showDetails(result.id, itemType);
                });
                container.appendChild(item);
            });
        }

        function loadSimilarContent(id, type) {
            if (!apiKey) return;
            const url = `https://api.themoviedb.org/3/${type}/${id}/similar?api_key=${apiKey}&language=en-US&page=1`;
            
            fetch(url).then(r => r.json()).then(data => {
                const validResults = getValidReleasedItems(data.results);
                displayResults(validResults, 'infoSimilar');
                displayResults(validResults, 'playerSimilarGrid', 15);
            }).catch(e => console.error(e));
        }

        function showDetails(id, type) {
            if (!apiKey) return;
            
            document.getElementById('resultsWrapper').style.display = 'none';
            document.getElementById('playerSection').style.display = 'none';
            document.getElementById('infoContainer').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const url = `https://api.themoviedb.org/3/${type}/${id}?api_key=${apiKey}&language=en-US&append_to_response=credits,videos`;

            fetch(url).then(r => r.json()).then(data => {
                currentTmdbId = data.id;
                currentType = type;
                currentTitle = data.title || data.name;
                currentTotalSeasons = data.number_of_seasons || 0;
                currentPoster = data.poster_path;

                document.getElementById('infoPoster').src = data.poster_path ? `https://image.tmdb.org/t/p/w500${data.poster_path}` : 'https://placehold.co/300x450/111/fff?text=No+Poster';
                document.getElementById('infoTitle').textContent = currentTitle;
                document.getElementById('infoRating').textContent = `★ ${data.vote_average ? data.vote_average.toFixed(1) : 'N/A'}/10`;
                
                const dateStr = data.release_date || data.first_air_date;
                document.getElementById('infoYear').textContent = dateStr ? dateStr.substring(0, 4) : 'N/A';
                document.getElementById('infoStatus').textContent = data.status || '';
                
                let runtimeStr = 'N/A';
                if (type === 'movie' && data.runtime) {
                    const h = Math.floor(data.runtime / 60);
                    const m = data.runtime % 60;
                    runtimeStr = `${h}h ${m}m`;
                } else if (type === 'tv' && data.episode_run_time && data.episode_run_time.length > 0) {
                    runtimeStr = `${data.episode_run_time[0]}m per ep`;
                }
                document.getElementById('infoRuntime').textContent = runtimeStr;

                const genresContainer = document.getElementById('infoGenres');
                genresContainer.innerHTML = '';
                if (data.genres) {
                    data.genres.forEach(g => {
                        const span = document.createElement('span');
                        span.className = 'genre-tag';
                        span.textContent = g.name;
                        genresContainer.appendChild(span);
                    });
                }

                document.getElementById('infoSynopsis').textContent = data.overview || 'No overview available.';

                const watchBtn = document.getElementById('btnWatchNow');
                watchBtn.onclick = () => playContent(currentTmdbId, currentType);

                const trailerBtn = document.getElementById('btnTrailer');
                const videos = data.videos?.results || [];
                const trailer = videos.find(v => v.site === 'YouTube' && v.type === 'Trailer');
                if (trailer) {
                    activeTrailerKey = trailer.key;
                    trailerBtn.style.display = 'inline-block';
                    trailerBtn.onclick = () => openTrailer(trailer.key);
                } else {
                    activeTrailerKey = null;
                    trailerBtn.style.display = 'none';
                }

                const s = JSON.parse(localStorage.getItem('savedItemsMap')) || {};
                const isSaved = !!s[currentTmdbId];
                document.getElementById('saveBtnText').textContent = isSaved ? "Remove" : "Save";
                const iconImg = document.getElementById('saveIconImg');
                if (iconImg) {
                    iconImg.src = isSaved ? "remove_save_wl.png" : "add_save_wl.png";
                }

                const castContainer = document.getElementById('infoCast');
                castContainer.innerHTML = '';
                if (data.credits && data.credits.cast) {
                    const topCast = data.credits.cast.slice(0, 10);
                    topCast.forEach(actor => {
                        const img = actor.profile_path ? `https://image.tmdb.org/t/p/w185${actor.profile_path}` : 'https://placehold.co/100x100/111/fff?text=?';
                        const safeActorName = actor.name.replace(/'/g, "\\'");
                        castContainer.innerHTML += `
                            <div class="cast-member" onclick="searchByActor(${actor.id}, '${safeActorName}')" title="See more from ${actor.name}">
                                <img src="${img}" class="cast-img" alt="${actor.name}">
                                <p class="cast-name">${actor.name}</p>
                                <p class="cast-role">${actor.character}</p>
                            </div>
                        `;
                    });
                }

                const formatMoney = amount => amount ? `$${(amount/1000000).toFixed(1)}M` : 'N/A';
                let sidebarHtml = '';
                let companyHtml = 'N/A';
                let companyLabel = type === 'movie' ? 'Studio' : 'Network';
                
                if (type === 'movie' && data.production_companies && data.production_companies.length > 0) {
                    companyHtml = data.production_companies.map(c => 
                        `<span class="clickable-detail" onclick="searchByCompany(${c.id}, '${c.name.replace(/'/g, "\\'")}')" title="More from ${c.name}">${c.name}</span>`
                    ).join(', ');
                } else if (type === 'tv' && data.networks && data.networks.length > 0) {
                    companyHtml = data.networks.map(n => 
                        `<span class="clickable-detail" onclick="searchByCompany(${n.id}, '${n.name.replace(/'/g, "\\'")}')" title="More from ${n.name}">${n.name}</span>`
                    ).join(', ');
                }

                if (type === 'movie') {
                    sidebarHtml = `
                        <div class="detail-item"><p class="detail-label">${companyLabel}</p><p class="detail-value">${companyHtml}</p></div>
                        <div class="detail-item"><p class="detail-label">Budget</p><p class="detail-value">${formatMoney(data.budget)}</p></div>
                        <div class="detail-item"><p class="detail-label">Revenue</p><p class="detail-value">${formatMoney(data.revenue)}</p></div>
                    `;
                } else {
                    sidebarHtml = `
                        <div class="detail-item"><p class="detail-label">${companyLabel}</p><p class="detail-value">${companyHtml}</p></div>
                        <div class="detail-item"><p class="detail-label">Seasons</p><p class="detail-value">${data.number_of_seasons}</p></div>
                        <div class="detail-item"><p class="detail-label">Episodes</p><p class="detail-value">${data.number_of_episodes}</p></div>
                    `;
                }
                const languages = data.spoken_languages?.map(l => l.name).join(', ') || 'N/A';
                sidebarHtml += `<div class="detail-item"><p class="detail-label">Languages</p><p class="detail-value">${languages}</p></div>`;
                document.getElementById('infoDetailsSidebar').innerHTML = sidebarHtml;

                loadSimilarContent(currentTmdbId, currentType);

            }).catch(e => console.error("Error fetching details:", e));
        }

        function searchByActor(personId, personName) {
            if (!apiKey) return;
            const type = document.getElementById('typeSelector').value;
            const url = `https://api.themoviedb.org/3/discover/${type}?api_key=${apiKey}&language=en-US&sort_by=popularity.desc&with_people=${personId}`;
            
            showResultsView();
            document.getElementById('resultsHeader').textContent = `Popular ${type === 'movie' ? 'Movies' : 'TV Shows'} starring ${personName}`;
            
            fetch(url).then(r => r.json()).then(data => {
                const validResults = getValidReleasedItems(data.results);
                if (validResults.length === 0) document.getElementById('results').innerHTML = '<p>No released titles found for this actor.</p>';
                else displayResults(validResults, 'results');
            }).catch(err => console.error(err));
        }

        function searchByCompany(companyId, companyName) {
            if (!apiKey) return;
            const type = document.getElementById('typeSelector').value;
            const param = type === 'movie' ? `with_companies=${companyId}` : `with_networks=${companyId}`;
            const url = `https://api.themoviedb.org/3/discover/${type}?api_key=${apiKey}&language=en-US&sort_by=popularity.desc&${param}`;
            
            showResultsView();
            document.getElementById('resultsHeader').textContent = `Popular ${type === 'movie' ? 'Movies' : 'TV Shows'} from ${companyName}`;
            
            fetch(url).then(r => r.json()).then(data => {
                const validResults = getValidReleasedItems(data.results);
                if (validResults.length === 0) document.getElementById('results').innerHTML = '<p>No released titles found for this studio/network.</p>';
                else displayResults(validResults, 'results');
            }).catch(err => console.error(err));
        }

        function updateWatchHistory(id, type, title, poster, season=null, episode=null) {
            let h = JSON.parse(localStorage.getItem('watchHistoryMap')) || {};
            h[id] = { id, type, title, poster, season, episode, ts: Date.now() };
            localStorage.setItem('watchHistoryMap', JSON.stringify(h));
        }

        function showKeepWatching() {
            document.getElementById('searchInput').value = '';
            document.getElementById('advancedSearchPanel').style.display = 'none';
            showResultsView();
            document.getElementById('resultsHeader').textContent = "Keep Watching";
            
            let h = JSON.parse(localStorage.getItem('watchHistoryMap')) || {};
            const list = Object.values(h).sort((a, b) => b.ts - a.ts).map(item => ({
                id: item.id,
                title: item.season ? `${item.title} (S${item.season} E${item.episode})` : item.title,
                poster_path: item.poster,
                media_type: item.type
            }));
            
            if (list.length === 0) {
                document.getElementById('results').innerHTML = '<p style="font-size:1.2rem; margin-top: 20px;">Nothing here yet. Go watch something!</p>';
            } else {
                displayResults(list, 'results');
            }
        }

        function toggleSaved() {
            let s = JSON.parse(localStorage.getItem('savedItemsMap')) || {};
            const iconImg = document.getElementById('saveIconImg');
            
            if (s[currentTmdbId]) {
                delete s[currentTmdbId];
                showMessage("Removed from Saved List");
                document.getElementById('saveBtnText').textContent = "Save";
                if (iconImg) iconImg.src = "add_save_wl.png";
            } else {
                s[currentTmdbId] = { id: currentTmdbId, type: currentType, title: currentTitle, poster: currentPoster, ts: Date.now() };
                showMessage("Added to Saved List");
                document.getElementById('saveBtnText').textContent = "Remove";
                if (iconImg) iconImg.src = "remove_save_wl.png";
            }
            localStorage.setItem('savedItemsMap', JSON.stringify(s));
        }

        function showSavedList() {
            document.getElementById('searchInput').value = '';
            document.getElementById('advancedSearchPanel').style.display = 'none';
            showResultsView();
            
            const selectedType = document.getElementById('typeSelector').value;
            const headerText = selectedType === 'movie' ? "Saved Movies" : "Saved TV Shows";
            document.getElementById('resultsHeader').textContent = headerText;
            
            let s = JSON.parse(localStorage.getItem('savedItemsMap')) || {};
            const list = Object.values(s)
                .filter(item => item.type === selectedType)
                .sort((a, b) => b.ts - a.ts)
                .map(item => ({
                    id: item.id,
                    title: item.title,
                    poster_path: item.poster,
                    media_type: item.type
                }));
            
            if (list.length === 0) {
                document.getElementById('results').innerHTML = `<p style="font-size:1.2rem; margin-top: 20px;">Your ${selectedType === 'movie' ? 'movie' : 'TV show'} watchlist is empty. Save some titles!</p>`;
            } else {
                displayResults(list, 'results');
            }
        }

        function playContent(id, type) {
            document.getElementById('infoContainer').style.display = 'none';
            document.getElementById('playerSection').style.display = 'block';
            document.getElementById('bottomSimilarContainer').style.display = 'block';

            if (type === 'tv') {
                const savedMap = JSON.parse(localStorage.getItem('watchHistoryMap')) || {};
                const savedHistory = savedMap[id];
                let startSeason = savedHistory && savedHistory.season ? savedHistory.season : 1;
                let startEpisode = savedHistory && savedHistory.episode ? savedHistory.episode : 1;
                
                if (savedHistory) showMessage(`Resuming: S${startSeason} E${startEpisode}`);
                
                document.getElementById('episodeControls').style.display = 'flex';
                updateWatchHistory(id, type, currentTitle, currentPoster, startSeason, startEpisode);
                embedTvShow(id, startSeason, startEpisode);
            } else {
                document.getElementById('episodeControls').style.display = 'none';
                updateWatchHistory(id, type, currentTitle, currentPoster);
                embedMovie(id);
            }
        }

        function embedMovie(id) {
            const saved = localStorage.getItem(`progress_${id}`);
            const startParam = saved ? `&startAt=${saved}` : '';
            const embedUrl = `https://vidsrcme.ru/embed/movie?tmdb=${id}&autoplay=1&color=e50914&ds_lang=en${startParam}`;
            
            const playerContainer = document.getElementById('player');
            playerContainer.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            
            document.getElementById('imdbIdDisplay').textContent = `Watching: ${currentTitle}`;
        }

        function embedTvShow(id, season, episode) {
            currentSeason = parseInt(season);
            currentEpisode = parseInt(episode);
            document.getElementById('seasonInput').value = season;
            document.getElementById('episodeInput').value = episode;

            updateWatchHistory(id, 'tv', currentTitle, currentPoster, season, episode);

            const saved = localStorage.getItem(`progress_${id}`);
            const startParam = saved ? `&startAt=${saved}` : '';
            const embedUrl = `https://vidsrcme.ru/embed/tv?tmdb=${id}&season=${season}&episode=${episode}&autoplay=1&autonext=1&color=e50914&ds_lang=en${startParam}`;
            
            const playerContainer = document.getElementById('player');
            playerContainer.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            
            document.getElementById('imdbIdDisplay').textContent = `Watching: ${currentTitle} - S${season}:E${episode}`;
            
            document.getElementById('prevSeason').style.visibility = currentSeason <= 1 ? 'hidden' : 'visible';
            document.getElementById('prevEpisode').style.visibility = (currentSeason <= 1 && currentEpisode <= 1) ? 'hidden' : 'visible';
        }

        function handlePlayerEvents(event) {
            if (event.data.type !== 'PLAYER_EVENT') return;
            const { player_info, player_status, player_progress } = event.data.data;
            const id = player_info.tmdb || player_info.imdb || currentTmdbId;

            if (player_status === 'playing') {
                localStorage.setItem(`progress_${id}`, player_progress);
                if (player_info.mediaType === 'tv' && player_info.season && player_info.episode) {
                    updateWatchHistory(id, player_info.mediaType, currentTitle, currentPoster, player_info.season, player_info.episode);
                }
            } else if (player_status === 'completed') {
                localStorage.removeItem(`progress_${id}`);
                if (player_info.mediaType === 'tv') {
                    const season = parseInt(player_info.season);
                    const nextEp = parseInt(player_info.episode) + 1;
                    currentSeason = season;
                    currentEpisode = nextEp;
                    embedTvShow(id, currentSeason, currentEpisode);
                }
            }
        }

        function showMessage(msg, err = false) {
            const b = document.getElementById('messageBox');
            b.textContent = msg;
            b.style.backgroundColor = err ? '#dc3545' : '#28a745';
            b.style.display = 'block';
            setTimeout(() => b.style.display = 'none', 5000);
        }

        function createParticles() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = `${Math.random() * 100}vw`;
                p.style.top = `${Math.random() * 100}vh`;
                p.style.animationDuration = `${Math.random() * 5 + 3}s`;
                p.style.animationDelay = `${Math.random() * 2}s`;
                c.appendChild(p);
            }
        }
    </script>
</body>
</html>
